<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FITNESS · Prototipo app Personal Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:#000;color:#F2F4F7;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;color:inherit;cursor:pointer}
#phone{width:390px;height:844px;max-height:100vh;background:linear-gradient(180deg,#000 0%,#1B1E22 45%,#4F545A 100%);color:#F2F4F7;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:28px;border:1px solid #3A3F45}
@media (max-width:500px){#phone{width:100%;height:100vh;border-radius:0;border:0}}
#top{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:16px;font-weight:800;color:#39FF14;letter-spacing:.14em;text-shadow:0 0 12px rgba(57,255,20,.5)}
.out{border:1px solid #39FF14;background:transparent;color:#39FF14;border-radius:999px;font-size:13px;font-weight:700;padding:8px 14px;min-height:40px}
.err{background:#3A0F0C;color:#FFB4AB;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:10px}
.lab{display:block;font-size:13px;font-weight:700;color:#D5DAE0;margin:14px 0 6px}
#main{flex:1;overflow-y:auto;padding:12px 20px 20px}
h1{margin:6px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.02em;color:#fff}
.sub{margin:0 0 14px;font-size:15px;color:#E3E7EC;font-weight:500}
.card{background:rgba(8,10,12,.74);color:#F2F4F7;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;margin-bottom:10px}
.lime{background:#39FF14;color:#04110A;border:0;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 0 24px rgba(57,255,20,.35)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t{font-size:16px;font-weight:600}.m{font-size:13px;color:#B8BFC8}
.lbl{font-size:12px;font-weight:800;color:#D5DAE0;letter-spacing:.06em;margin:16px 0 8px}
.btn{height:48px;border-radius:14px;border:0;background:#39FF14;color:#04110A;font-size:15px;font-weight:800;width:100%;padding:0 16px;box-shadow:0 0 16px rgba(57,255,20,.3)}
.btn.o{background:transparent;border:1px solid #39FF14;color:#39FF14;box-shadow:none}
.sm{height:44px;min-width:44px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#F2F4F7;font-size:18px;font-weight:700}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#F2F4F7;font-weight:700;font-size:15px}
.set.on{background:#39FF14;color:#04110A;border-color:#39FF14}
.bar{height:8px;border-radius:4px;background:rgba(4,17,10,.25)}.bar i{display:block;height:8px;border-radius:4px;background:#04110A}
.pill{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;color:#04110A;background:#39FF14;white-space:nowrap}
.pill.w{background:#FFB454;color:#2A1A00}
input,select{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(8,10,12,.74);color:#fff;font-family:inherit;font-size:15px;padding:0 14px}
input::placeholder{color:#A9B0B8}
option{background:#111316;color:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid #39FF14;outline-offset:2px}
#nav{display:flex;justify-content:space-around;background:rgba(0,0,0,.88);border-top:1px solid rgba(255,255,255,.1);padding:6px 8px 14px}
#nav button{min-width:64px;min-height:48px;border:0;background:transparent;color:#AEB5BD;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#nav button.on{color:#39FF14}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{min-width:56px;height:64px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,12,.74);color:#F2F4F7;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day b{font-size:18px}.day.on{background:#39FF14;color:#04110A;border-color:#39FF14}
.slot{height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,12,.74);color:#F2F4F7;font-weight:600;font-size:15px}
.slot.mine{background:#39FF14;border-color:#39FF14;color:#04110A;font-weight:800}
.slot.taken{opacity:.45;cursor:default}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bub{max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.35;margin-bottom:8px}
.bub.me{align-self:flex-end;background:#39FF14;color:#04110A;border-bottom-right-radius:4px;font-weight:600}
.bub.you{align-self:flex-start;background:rgba(8,10,12,.8);color:#F2F4F7;border:1px solid rgba(255,255,255,.14);border-bottom-left-radius:4px}
#rest{position:absolute;left:20px;right:20px;bottom:86px;background:#39FF14;color:#04110A;border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;font-weight:800;box-shadow:0 0 20px rgba(57,255,20,.5)}
#rest button{background:#04110A;color:#39FF14;border:0;border-radius:10px;min-height:40px;padding:0 14px;font-weight:700}
.avimg{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.galg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:3px}
.gal{padding:0;border:2px solid rgba(255,255,255,.25);border-radius:50%;overflow:hidden;width:100%;aspect-ratio:1;background:transparent;display:block}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal.on{border-color:#fff;box-shadow:0 0 0 3px #39FF14,0 0 14px rgba(57,255,20,.5)}
.avbob{animation:bob 3s ease-in-out infinite}
.avey{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.avbob,.avey,.avimg,.pop{animation:none}}
.nb{background:none;border:0;padding:0;text-align:left;color:inherit;min-height:44px;display:block;font-family:inherit}
.tec{font-size:11px;font-weight:700;color:#39FF14;border:1px solid #39FF14;border-radius:999px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.figbox{background:radial-gradient(circle at 50% 35%,#2B3038,#0B0D10);border:1px solid rgba(255,255,255,.14);border-radius:20px;display:flex;justify-content:center;padding:8px}
.thumb{width:68px;height:68px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#2B3038,#0B0D10);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#EEF1F4}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.stepn{width:28px;height:28px;border-radius:14px;background:#39FF14;color:#04110A;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
#toast{position:absolute;left:20px;right:20px;bottom:92px;background:#fff;color:#04110A;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:5}
#cele{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:10;overflow:hidden}
.cbox{background:rgba(18,20,24,.97);border:1px solid #39FF14;border-radius:24px;padding:24px;width:100%;text-align:center;box-shadow:0 0 32px rgba(57,255,20,.35);position:relative;z-index:2;max-height:100%;overflow-y:auto}
.cbox h2{margin:12px 0 4px;font-size:24px;color:#fff}
.conf i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
.swr{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:22px;border:2px solid rgba(255,255,255,.3);padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px #39FF14}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(8,10,12,.74);color:#F2F4F7;font-weight:600;font-size:14px}
.chip.on{background:#39FF14;color:#04110A;border-color:#39FF14;font-weight:800}
.avb{width:44px;height:44px;border-radius:22px;border:2px solid #39FF14;padding:0;background:transparent;overflow:hidden;display:block}
.note{font-size:12px;color:#D5DAE0;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="phone">
  <div id="top"><span class="brand">FITNESS</span>
    <div id="topR"></div>
  </div>
  <div id="main"></div>
  <div id="rest"><span id="restTxt">Descanso 60 s</span><button data-act="skipRest">Saltar</button></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="cele" role="dialog" aria-modal="true" aria-label="Entrenamiento completado"></div>
  <nav id="nav" aria-label="Navegación"></nav>
</div>
<script src="ejercicios.js"></script>
<script>
const iso=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const def=()=>({role:'c',tab:'hoy',
 routine:{name:'Pierna y glúteo',items:[{ex:'Sentadilla goblet',sets:4,reps:12,kg:20,done:0},{ex:'Peso muerto rumano',sets:4,reps:10,kg:30,done:0},{ex:'Hip thrust con barra',sets:4,reps:10,kg:40,done:0},{ex:'Zancadas caminando',sets:3,reps:12,kg:0,done:0}]},
 templates:[{name:'Pierna y glúteo',items:[{ex:'Sentadilla goblet',sets:4,reps:12,kg:20},{ex:'Peso muerto rumano',sets:4,reps:10,kg:30},{ex:'Hip thrust con barra',sets:4,reps:10,kg:40},{ex:'Zancadas caminando',sets:3,reps:12,kg:0}]},{name:'Tren superior',items:[{ex:'Press de banca',sets:4,reps:8,kg:25},{ex:'Remo con mancuerna',sets:4,reps:10,kg:14},{ex:'Press militar',sets:3,reps:10,kg:10}]}],
 weights:[65.5,65,64.6,64.2,63.9,63.4],bookings:[],
 chat:[{f:'t',x:'¡Hola Camila! Hoy toca pierna y glúteo. Cualquier duda me escribes.'}],
 clients:[{n:'Camila M.',goal:'Tonificar',days:0,pay:20,plan:'Plan mensual',amt:180,paid:true,method:'Yape'},{n:'Jorge R.',goal:'Fuerza',days:5,pay:12,plan:'Plan mensual',amt:180,paid:true,method:'Plin'},{n:'Lucía P.',goal:'Pérdida de grasa',days:1,pay:9,plan:'Plan premium',amt:220,paid:true,method:'Tarjeta'},{n:'Diego V.',goal:'Hipertrofia',days:0,pay:2,plan:'Plan mensual',amt:180,paid:false,method:''},{n:'Mateo S.',goal:'Resistencia',days:3,pay:-3,plan:'Plan básico',amt:140,paid:false,method:''}],
 auth:null,err:'',prev:null,avatars:{c:{img:'avatar-02',skin:'#F1C27D',hairStyle:'largo',hair:'#B5651D',eye:'#4A2C17',expr:'sonrisa',acc:'none',ropa:'polo',outfit:'#39FF14',bg:'#0FA3A3'},t:{img:'avatar-11',skin:'#8D5524',hairStyle:'trenzas',hair:'#1A1A1A',eye:'#4A2C17',expr:'guiño',acc:'lentes',ropa:'chaqueta',outfit:'#2D7DD2',bg:'#6C4BD1'}},sel:null,day:0,builder:{name:'',items:[]},filter:'all',q:'',gf:'Todos',ex:null,exPrev:null,records:{'Sentadilla goblet':{kg:20,reps:12},'Peso muerto rumano':{kg:30,reps:10},'Hip thrust con barra':{kg:40,reps:10},'Press de banca':{kg:25,reps:8},'Remo con mancuerna':{kg:14,reps:10}},hist:[{d:iso(2),name:'Tren superior',sets:14,vol:2480,prs:1},{d:iso(4),name:'Pierna y glúteo',sets:15,vol:3150,prs:0},{d:iso(7),name:'Tren superior',sets:13,vol:2310,prs:0},{d:iso(9),name:'Pierna y glúteo',sets:15,vol:3020,prs:1},{d:iso(11),name:'Tren superior',sets:12,vol:2200,prs:0},{d:iso(14),name:'Pierna y glúteo',sets:14,vol:2890,prs:0}],streak:12,lastDay:'',toast:null,cele:null,payOpen:null,inc:[640,760,820,760,900]});
let S=def();
try{const r=localStorage.getItem('pt-proto2');if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
{const DA=def().avatars,SA=S.avatars||{};S.avatars={c:Object.assign({},DA.c,SA.c),t:Object.assign({},DA.t,SA.t)};for(const k of ['c','t'])if(!/^avatar-\d\d$/.test(S.avatars[k].img||''))S.avatars[k].img=DA[k].img}
const save=()=>{try{localStorage.setItem('pt-proto2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const ic={hoy:'<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/>',ag:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',pr:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',ch:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',cl:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M17 5a3 3 0 0 1 0 6M22 20c0-3-1.5-4.8-4-5.6"/>',ru:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',ej:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/>',pa:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 0 1 0 3.6h-3a1.8 1.8 0 0 0 0 3.6h4"/>'};
const svg=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const TABS={c:[['hoy','Hoy','hoy'],['ej','Ejercicios','ej'],['ag','Agenda','ag'],['pr','Progreso','pr'],['ch','Chat','ch']],t:[['cl','Clientes','cl'],['ru','Rutinas','ru'],['ag','Agenda','ag'],['pa','Pagos','pa'],['ch','Chat','ch']]};
const dayList=()=>{const o=[],n=new Date(),N=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];for(let i=0;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);o.push({k:d.toISOString().slice(0,10),w:N[d.getDay()],n:d.getDate()})}return o};
const SLOTS=['07:00','08:00','09:00','10:00','17:00','18:00','19:00','20:00','21:00'];
const TAKEN=s=>(s.charCodeAt(0)+s.charCodeAt(1))%4===0;

let lastTab=null;
const AVDEF={c:'avatar-02',t:'avatar-11'};
function av(o,sz,r){const id=/^avatar-\d\d$/.test((o&&o.img)||'')?o.img:AVDEF[r||'c'];return `<span style="display:block;width:${sz}px;height:${sz}px;border-radius:50%;overflow:hidden"><img class="avimg" src="avatars/${id}.webp" width="${sz}" height="${sz}" alt="Avatar" style="display:block;width:100%;height:100%;object-fit:cover"></span>`}
function vAv(){const o=S.avatars[S.role];
 return `<h1>Mi avatar</h1><p class="sub">Elige el que más te guste</p><div style="display:flex;justify-content:center;margin:6px 0 14px"><div class="${S.pop?'pop':''}" style="border:3px solid #39FF14;border-radius:50%;box-shadow:0 0 24px rgba(57,255,20,.35)">${av(o,150,S.role)}</div></div><div class="galg" role="group" aria-label="Galería de avatares">`+Array.from({length:16},(_,i)=>{const id='avatar-'+String(i+1).padStart(2,'0');return `<button class="gal ${o.img===id?'on':''}" aria-label="Avatar ${i+1}" aria-pressed="${o.img===id}" data-act="avimg" data-v="${id}"><img src="avatars/${id}.webp" alt="" width="80" height="80" loading="lazy"></button>`}).join('')+`</div><div style="margin-top:20px"><button class="btn" data-act="closeAv">Listo</button></div>`}
function vHoy(){const r=S.routine,tot=r.items.reduce((a,i)=>a+i.sets,0),dn=r.items.reduce((a,i)=>a+i.done,0),pct=tot?Math.round(dn/tot*100):0;
 return `<div class="row" style="margin-bottom:14px">${av(S.avatars.c,56)}<div><h1 style="margin:0">Hola, Camila</h1><p class="sub" style="margin:0">Tu entrenamiento de hoy</p><span class="pill" style="display:inline-block;margin-top:6px">Racha: ${S.streak} días</span></div></div>
 <div class="lime"><div class="m" style="color:#04110A;opacity:.8;font-weight:600">Rutina asignada</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px">${esc(r.name)}</div><div class="bar"><i style="width:${pct}%"></i></div><div style="font-size:13px;font-weight:700;margin-top:6px">${dn} de ${tot} series · ${pct}%${pct===100?' · ¡Completado!':''}</div></div>
 <div class="lbl">EJERCICIOS</div>`+r.items.map((it,i)=>`<div class="card"><div class="row"><button class="grow nb" data-act="exopen" data-n="${esc(it.ex)}" aria-label="Ver técnica de ${esc(it.ex)}"><div class="t">${esc(it.ex)} <span class="tec">Ver técnica</span></div><div class="m">${it.sets} × ${it.reps}${it.kg?' · '+kgf(it.kg)+' kg':' · peso corporal'}</div></button>${it.kg?`<button class="sm" aria-label="Bajar peso" data-act="kg" data-i="${i}" data-d="-2.5">−</button><button class="sm" aria-label="Subir peso" data-act="kg" data-i="${i}" data-d="2.5">+</button>`:''}</div><div class="sets">${Array.from({length:it.sets},(_,k)=>`<button class="set ${k<it.done?'on':''}" aria-label="Serie ${k+1}" aria-pressed="${k<it.done}" data-act="set" data-i="${i}" data-k="${k}">${k+1}</button>`).join('')}</div></div>`).join('')+(dn>0?`<button class="btn" style="margin-top:6px" data-act="finish">Terminar entrenamiento</button>`:'')+`<p class="note">Marca cada serie al terminarla: se inicia el descanso.</p>`}

function vAgenda(){const ds=dayList(),d=ds[S.day];
 const mine=S.bookings.filter(b=>b.startsWith(d.k));
 let h=`<h1>Agenda</h1><p class="sub">${S.role==='c'?'Reserva tus sesiones':'Sesiones reservadas por tus clientes'}</p><div class="days">`+ds.map((x,i)=>`<button class="day ${i===S.day?'on':''}" data-act="day" data-i="${i}">${x.w}<b>${x.n}</b></button>`).join('')+`</div><div class="lbl">HORARIOS</div><div class="grid3">`;
 h+=SLOTS.map(t=>{const key=d.k+'|'+t,m=S.bookings.includes(key),tk=TAKEN(t+d.n)&&!m;return `<button class="slot ${m?'mine':''} ${tk?'taken':''}" ${tk||S.role==='t'?'disabled':''} data-act="book" data-k="${key}">${t}${m?' ✓':''}</button>`}).join('')+`</div>`;
 h+=`<div class="lbl">${S.role==='c'?'MIS SESIONES':'SESIONES CON CAMILA'}</div>`;
 const all=[...S.bookings].sort();
 h+=all.length?all.map(b=>{const[a,t]=b.split('|');return `<div class="card row"><div class="grow"><div class="t">${t} · ${a.split('-').reverse().join('/')}</div><div class="m">Camila M. · Presencial</div></div>${S.role==='c'?`<button class="sm" style="font-size:13px;padding:0 12px" data-act="book" data-k="${b}">Cancelar</button>`:'<span class="pill">Confirmada</span>'}</div>`}).join(''):`<div class="card m">Sin sesiones reservadas todavía.</div>`;
 return h}

function vProg(){const w=S.weights,mn=Math.min(...w)-.5,mx=Math.max(...w)+.5,pts=w.map((v,i)=>`${8+i*(304/Math.max(w.length-1,1))},${100-((v-mn)/(mx-mn))*85}`);const last=pts[pts.length-1].split(',');

 else if(a==='set'){const it=S.routine.items[+d.i],k=+d.k;if(it.done===k+1){it.done=k}else{it.done=k+1;startRest()}}
 else if(a==='day'){S.day=+d.i}
 else if(a==='book'){const i=S.bookings.indexOf(d.k);if(i>=0)S.bookings.splice(i,1);else S.bookings.push(d.k)}
 else if(a==='addW'){const v=parseFloat(($('wIn').value||'').replace(',','.'));if(!(v>20&&v<300))return;S.weights.push(v)}
 else if(a==='send'){const v=$('cIn').value.trim();if(!v)return;S.chat.push({f:S.role==='c'?'c':'t',x:v})}
 else if(a==='flt'){S.filter=d.v}
 else if(a==='open'){S.sel=+d.i}
 else if(a==='back'){S.sel=null}
 else if(a==='toChat'){S.tab='ch'}
 else if(a==='assign'){const t=S.templates[+$('asg').value];S.routine={name:t.name,items:t.items.map(i=>({...i,done:0}))};S.chat.push({f:'t',x:'Te asigné una nueva rutina: '+t.name+'. ¡Mucho éxito!'});S.clients[0].days=0}
 else if(a==='addEx'){S.builder.name=$('bName').value;S.builder.items.push({ex:$('bSel').value,sets:3,reps:10,kg:0})}
 else if(a==='rmEx'){S.builder.name=$('bName').value;S.builder.items.splice(+d.i,1)}
 else if(a==='saveR'){const n=$('bName').value.trim();if(!n||!S.builder.items.length)return;S.templates.push({name:n,items:S.builder.items});S.builder={name:'',items:[]}}
 else if(a==='exopen'){const id=d.id||EXN[d.n];if(!id){S.toast='Aún no hay ficha de este ejercicio'}else{if(S.tab!=='ej')S.exPrev=S.tab;S.ex=id;S.tab='ej'}}
 else if(a==='exback'){S.ex=null;if(S.exPrev){S.tab=S.exPrev;S.exPrev=null}}
 else if(a==='exadd'){const e=EXD(S.ex);if(S.routine.items.some(i=>i.ex===e.n))S.toast='Ya está en tu rutina de hoy';else{S.routine.items.push({ex:e.n,sets:3,reps:10,kg:0,done:0});S.toast='Agregado a tu rutina de hoy'}}
 else if(a==='gf'){S.gf=d.v}
 else if(a==='finish'){finish()}
 else if(a==='ceClose'){S.cele=null}
 else if(a==='payopen'){S.payOpen=S.payOpen===+d.i?null:+d.i}
 else if(a==='paypay'){const c=S.clients[+d.i];c.paid=true;c.pay=30;c.method=d.m;S.payOpen=null;S.toast='Pago registrado: '+c.n+' · '+money(c.amt)+' ('+d.m+')'}
 else if(a==='payrem'){S.toast='Recordatorio enviado a '+S.clients[+d.i].n.split(' ')[0]}
 render()});
document.addEventListener('input',e=>{if(e.target.id==='eq'){const p=e.target.selectionStart;S.q=e.target.value;render();const n=$('eq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='cIn'){e.preventDefault();document.querySelector('[data-act=send]').click()}if(e.target.id==='wIn'){e.preventDefault();document.querySelector('[data-act=addW]').click()}}});
render();
</script>
</body>
</html>
