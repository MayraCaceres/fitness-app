<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FITNESS · Prototipo app Personal Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:#000;color:#F2F4F7;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;color:inherit;cursor:pointer}
#phone{width:390px;height:844px;max-height:100vh;background:linear-gradient(180deg,#000 0%,#1B1E22 45%,#4F545A 100%);color:#F2F4F7;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:28px;border:1px solid #3A3F45}
@media (max-width:500px){#phone{width:100%;height:100vh;border-radius:0;border:0}}
#top{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:16px;font-weight:800;color:#39FF14;letter-spacing:.14em;text-shadow:0 0 12px rgba(57,255,20,.5)}
.out{border:1px solid #39FF14;background:transparent;color:#39FF14;border-radius:999px;font-size:13px;font-weight:700;padding:8px 14px;min-height:40px}
.err{background:#3A0F0C;color:#FFB4AB;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:10px}
.lab{display:block;font-size:13px;font-weight:700;color:#D5DAE0;margin:14px 0 6px}
#main{flex:1;overflow-y:auto;padding:12px 20px 20px}
h1{margin:6px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.02em;color:#fff}
.sub{margin:0 0 14px;font-size:15px;color:#E3E7EC;font-weight:500}
.card{background:rgba(8,10,12,.74);color:#F2F4F7;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;margin-bottom:10px}
.lime{background:#39FF14;color:#04110A;border:0;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 0 24px rgba(57,255,20,.35)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t{font-size:16px;font-weight:600}.m{font-size:13px;color:#B8BFC8}
.lbl{font-size:12px;font-weight:800;color:#D5DAE0;letter-spacing:.06em;margin:16px 0 8px}
.btn{height:48px;border-radius:14px;border:0;background:#39FF14;color:#04110A;font-size:15px;font-weight:800;width:100%;padding:0 16px;box-shadow:0 0 16px rgba(57,255,20,.3)}
.btn.o{background:transparent;border:1px solid #39FF14;color:#39FF14;box-shadow:none}
.sm{height:44px;min-width:44px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#F2F4F7;font-size:18px;font-weight:700}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#F2F4F7;font-weight:700;font-size:15px}
.set.on{background:#39FF14;color:#04110A;border-color:#39FF14}
.bar{height:8px;border-radius:4px;background:rgba(4,17,10,.25)}.bar i{display:block;height:8px;border-radius:4px;background:#04110A}
.pill{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;color:#04110A;background:#39FF14;white-space:nowrap}
.pill.w{background:#FFB454;color:#2A1A00}
input,select{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(8,10,12,.74);color:#fff;font-family:inherit;font-size:15px;padding:0 14px}
input::placeholder{color:#A9B0B8}
option{background:#111316;color:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid #39FF14;outline-offset:2px}
#nav{display:flex;justify-content:space-around;background:rgba(0,0,0,.88);border-top:1px solid rgba(255,255,255,.1);padding:6px 8px 14px}
#nav button{min-width:64px;min-height:48px;border:0;background:transparent;color:#AEB5BD;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#nav button.on{color:#39FF14}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{min-width:56px;height:64px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,12,.74);color:#F2F4F7;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day b{font-size:18px}.day.on{background:#39FF14;color:#04110A;border-color:#39FF14}
.slot{height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,12,.74);color:#F2F4F7;font-weight:600;font-size:15px}
.slot.mine{background:#39FF14;border-color:#39FF14;color:#04110A;font-weight:800}
.slot.taken{opacity:.45;cursor:default}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bub{max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.35;margin-bottom:8px}
.bub.me{align-self:flex-end;background:#39FF14;color:#04110A;border-bottom-right-radius:4px;font-weight:600}
.bub.you{align-self:flex-start;background:rgba(8,10,12,.8);color:#F2F4F7;border:1px solid rgba(255,255,255,.14);border-bottom-left-radius:4px}
#rest{position:absolute;left:20px;right:20px;bottom:86px;background:#39FF14;color:#04110A;border-radius:16px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;font-weight:800;box-shadow:0 0 20px rgba(57,255,20,.5)}
#rest button{background:#04110A;color:#39FF14;border:0;border-radius:10px;min-height:40px;padding:0 14px;font-weight:700}
.note{font-size:12px;color:#D5DAE0;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="phone">
  <div id="top"><span class="brand">FITNESS</span>
    <div id="topR"></div>
  </div>
  <div id="main"></div>
  <div id="rest"><span id="restTxt">Descanso 60 s</span><button data-act="skipRest">Saltar</button></div>
  <nav id="nav" aria-label="Navegación"></nav>
</div>
<script>
const LIB=[{id:'sq',n:'Sentadilla goblet',g:'Pierna'},{id:'rdl',n:'Peso muerto rumano',g:'Pierna'},{id:'ht',n:'Hip thrust con barra',g:'Glúteo'},{id:'lg',n:'Zancadas caminando',g:'Pierna'},{id:'bp',n:'Press de banca',g:'Pecho'},{id:'row',n:'Remo con mancuerna',g:'Espalda'},{id:'ohp',n:'Press militar',g:'Hombro'},{id:'pl',n:'Plancha',g:'Core'}];
const def=()=>({role:'c',tab:'hoy',
 routine:{name:'Pierna y glúteo',items:[{ex:'Sentadilla goblet',sets:4,reps:12,kg:20,done:0},{ex:'Peso muerto rumano',sets:4,reps:10,kg:30,done:0},{ex:'Hip thrust con barra',sets:4,reps:10,kg:40,done:0},{ex:'Zancadas caminando',sets:3,reps:12,kg:0,done:0}]},
 templates:[{name:'Pierna y glúteo',items:[{ex:'Sentadilla goblet',sets:4,reps:12,kg:20},{ex:'Peso muerto rumano',sets:4,reps:10,kg:30},{ex:'Hip thrust con barra',sets:4,reps:10,kg:40},{ex:'Zancadas caminando',sets:3,reps:12,kg:0}]},{name:'Tren superior',items:[{ex:'Press de banca',sets:4,reps:8,kg:25},{ex:'Remo con mancuerna',sets:4,reps:10,kg:14},{ex:'Press militar',sets:3,reps:10,kg:10}]}],
 weights:[65.5,65,64.6,64.2,63.9,63.4],bookings:[],
 chat:[{f:'t',x:'¡Hola Camila! Hoy toca pierna y glúteo. Cualquier duda me escribes.'}],
 clients:[{n:'Camila M.',goal:'Tonificar',days:0,pay:20},{n:'Jorge R.',goal:'Fuerza',days:5,pay:12},{n:'Lucía P.',goal:'Pérdida de grasa',days:1,pay:9},{n:'Diego V.',goal:'Hipertrofia',days:0,pay:2}],
 auth:null,err:'',sel:null,day:0,builder:{name:'',items:[]},filter:'all'});
let S=def();
try{const r=localStorage.getItem('pt-proto');if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('pt-proto',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const ic={hoy:'<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/>',ag:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',pr:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',ch:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',cl:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M17 5a3 3 0 0 1 0 6M22 20c0-3-1.5-4.8-4-5.6"/>',ru:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'};
const svg=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const TABS={c:[['hoy','Hoy','hoy'],['ag','Agenda','ag'],['pr','Progreso','pr'],['ch','Chat','ch']],t:[['cl','Clientes','cl'],['ru','Rutinas','ru'],['ag','Agenda','ag'],['ch','Chat','ch']]};
const dayList=()=>{const o=[],n=new Date(),N=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];for(let i=0;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);o.push({k:d.toISOString().slice(0,10),w:N[d.getDay()],n:d.getDate()})}return o};
const SLOTS=['07:00','08:00','09:00','10:00','17:00','18:00','19:00','20:00','21:00'];
const TAKEN=s=>(s.charCodeAt(0)+s.charCodeAt(1))%4===0;

function vHoy(){const r=S.routine,tot=r.items.reduce((a,i)=>a+i.sets,0),dn=r.items.reduce((a,i)=>a+i.done,0),pct=tot?Math.round(dn/tot*100):0;
 return `<h1>Hola, Camila</h1><p class="sub">Tu entrenamiento de hoy</p>
 <div class="lime"><div class="m" style="color:#04110A;opacity:.8;font-weight:600">Rutina asignada</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px">${esc(r.name)}</div><div class="bar"><i style="width:${pct}%"></i></div><div style="font-size:13px;font-weight:700;margin-top:6px">${dn} de ${tot} series · ${pct}%${pct===100?' · ¡Completado!':''}</div></div>
 <div class="lbl">EJERCICIOS</div>`+r.items.map((it,i)=>`<div class="card"><div class="row"><div class="grow"><div class="t">${esc(it.ex)}</div><div class="m">${it.sets} × ${it.reps}${it.kg?' · '+it.kg+' kg':' · peso corporal'}</div></div>${it.kg?`<button class="sm" aria-label="Bajar peso" data-act="kg" data-i="${i}" data-d="-2.5">−</button><button class="sm" aria-label="Subir peso" data-act="kg" data-i="${i}" data-d="2.5">+</button>`:''}</div><div class="sets">${Array.from({length:it.sets},(_,k)=>`<button class="set ${k<it.done?'on':''}" aria-label="Serie ${k+1}" aria-pressed="${k<it.done}" data-act="set" data-i="${i}" data-k="${k}">${k+1}</button>`).join('')}</div></div>`).join('')+`<p class="note">Marca cada serie al terminarla: se inicia el descanso.</p>`}

function vAgenda(){const ds=dayList(),d=ds[S.day];
 const mine=S.bookings.filter(b=>b.startsWith(d.k));
 let h=`<h1>Agenda</h1><p class="sub">${S.role==='c'?'Reserva tus sesiones':'Sesiones reservadas por tus clientes'}</p><div class="days">`+ds.map((x,i)=>`<button class="day ${i===S.day?'on':''}" data-act="day" data-i="${i}">${x.w}<b>${x.n}</b></button>`).join('')+`</div><div class="lbl">HORARIOS</div><div class="grid3">`;
 h+=SLOTS.map(t=>{const key=d.k+'|'+t,m=S.bookings.includes(key),tk=TAKEN(t+d.n)&&!m;return `<button class="slot ${m?'mine':''} ${tk?'taken':''}" ${tk||S.role==='t'?'disabled':''} data-act="book" data-k="${key}">${t}${m?' ✓':''}</button>`}).join('')+`</div>`;
 h+=`<div class="lbl">${S.role==='c'?'MIS SESIONES':'SESIONES CON CAMILA'}</div>`;
 const all=[...S.bookings].sort();
 h+=all.length?all.map(b=>{const[a,t]=b.split('|');return `<div class="card row"><div class="grow"><div class="t">${t} · ${a.split('-').reverse().join('/')}</div><div class="m">Camila M. · Presencial</div></div>${S.role==='c'?`<button class="sm" style="font-size:13px;padding:0 12px" data-act="book" data-k="${b}">Cancelar</button>`:'<span class="pill">Confirmada</span>'}</div>`}).join(''):`<div class="card m">Sin sesiones reservadas todavía.</div>`;
 return h}

function vProg(){const w=S.weights,mn=Math.min(...w)-.5,mx=Math.max(...w)+.5,pts=w.map((v,i)=>`${8+i*(304/Math.max(w.length-1,1))},${100-((v-mn)/(mx-mn))*85}`);const last=pts[pts.length-1].split(',');
 const diff=(w[w.length-1]-w[0]).toFixed(1).replace('.',',');
 return `<h1>Tu progreso</h1><p class="sub">Seguimiento de peso corporal</p><div class="card"><div class="row"><div class="grow"><div class="m" style="font-weight:600">Peso actual</div><div style="font-size:32px;font-weight:800;letter-spacing:-.02em">${String(w[w.length-1]).replace('.',',')} <span class="m" style="font-size:16px">kg</span></div></div><span class="pill">${diff} kg</span></div>
 <svg viewBox="0 0 320 110" width="100%" role="img" aria-label="Gráfico de peso corporal" style="margin-top:10px;display:block"><line x1="0" y1="102" x2="320" y2="102" stroke="rgba(255,255,255,.2)"/><polyline points="${pts.join(' ')}" fill="none" stroke="#39FF14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="6" fill="#39FF14"/></svg></div>
 <div class="lbl">REGISTRAR PESO</div><div class="row"><input id="wIn" type="number" step="0.1" inputmode="decimal" placeholder="Ej. 63,0" aria-label="Peso en kg"><button class="btn" style="width:120px" data-act="addW">Guardar</button></div>
 <div class="lbl">HOY</div><div class="card row"><div class="grow"><div class="t">Series completadas</div><div class="m">${S.routine.items.reduce((a,i)=>a+i.done,0)} de ${S.routine.items.reduce((a,i)=>a+i.sets,0)}</div></div></div>`}

function vChat(){const me=S.role==='c'?'c':'t';
 return `<h1>Chat</h1><p class="sub">${S.role==='c'?'Con tu entrenador':'Con Camila M.'}</p><div style="display:flex;flex-direction:column;min-height:300px" id="msgs">`+S.chat.map(m=>`<div class="bub ${m.f===me?'me':'you'}">${esc(m.x)}</div>`).join('')+`</div><div class="row" style="margin-top:8px"><input id="cIn" placeholder="Escribe un mensaje" aria-label="Mensaje"><button class="btn" style="width:96px" data-act="send">Enviar</button></div><p class="note">Cambia de modo arriba para ver los dos lados de la conversación.</p>`}

function vClientes(){if(S.sel!=null){const c=S.clients[S.sel];return `<button class="btn o" style="width:auto;height:44px" data-act="back">← Clientes</button><h1>${esc(c.n)}</h1><p class="sub">Objetivo: ${esc(c.goal)}</p>
 <div class="card"><div class="m">Último entrenamiento</div><div class="t">${c.days===0?'Hoy':'Hace '+c.days+' días'}</div></div>
 <div class="card"><div class="m">Membresía</div><div class="t">Vence en ${c.pay} días</div></div>
 ${S.sel===0?`<div class="card"><div class="m">Rutina actual</div><div class="t">${esc(S.routine.name)}</div></div><div class="lbl">ASIGNAR RUTINA</div><select id="asg" aria-label="Rutina">${S.templates.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select><div style="height:10px"></div><button class="btn" data-act="assign">Asignar a Camila</button>`:'<p class="note">En este prototipo solo Camila recibe rutinas.</p>'}
 <div style="height:10px"></div><button class="btn o" data-act="toChat">Escribir a Camila</button>`}
 const f=S.filter,list=S.clients.map((c,i)=>({c,i})).filter(x=>f==='all'||(f==='idle'&&x.c.days>=3)||(f==='pay'&&x.c.pay<=3));
 return `<h1>Mis clientes</h1><p class="sub">${S.clients.length} activos</p><div class="row" style="margin-bottom:12px"><button class="btn ${f==='all'?'':'o'}" style="height:44px" data-act="flt" data-v="all">Todos</button><button class="btn ${f==='idle'?'':'o'}" style="height:44px" data-act="flt" data-v="idle">Sin entrenar</button><button class="btn ${f==='pay'?'':'o'}" style="height:44px" data-act="flt" data-v="pay">Pagos</button></div>`+
 list.map(({c,i})=>`<button class="card row" style="width:100%;text-align:left" data-act="open" data-i="${i}"><div style="width:44px;height:44px;border-radius:22px;background:#39FF14;color:#04110A;display:flex;align-items:center;justify-content:center;font-weight:700">${c.n.split(' ').map(s=>s[0]).join('')}</div><div class="grow"><div class="t">${esc(c.n)}</div><div class="m">${esc(c.goal)}</div></div>${c.days>=3?`<span class="pill w">${c.days} días sin entrenar</span>`:c.pay<=3?`<span class="pill w">Pago en ${c.pay} d</span>`:'<span class="pill">Al día</span>'}</button>`).join('')}

function vRut(){const b=S.builder;
 return `<h1>Rutinas</h1><p class="sub">Tus plantillas</p>`+S.templates.map(t=>`<div class="card"><div class="t">${esc(t.name)}</div><div class="m">${t.items.length} ejercicios · ${t.items.map(i=>esc(i.ex)).join(', ')}</div></div>`).join('')+
 `<div class="lbl">CREAR NUEVA RUTINA</div><input id="bName" placeholder="Nombre de la rutina" aria-label="Nombre" value="${esc(b.name)}">
 <div style="height:10px"></div><select id="bSel" aria-label="Ejercicio">${LIB.map(e=>`<option value="${e.n}">${e.n} (${e.g})</option>`).join('')}</select><div style="height:10px"></div><button class="btn o" data-act="addEx">+ Agregar ejercicio (3 × 10)</button>`+
 b.items.map((it,i)=>`<div class="card row"><div class="grow"><div class="t">${esc(it.ex)}</div><div class="m">${it.sets} × ${it.reps}</div></div><button class="sm" aria-label="Quitar" data-act="rmEx" data-i="${i}">×</button></div>`).join('')+
 `<div style="height:6px"></div><button class="btn" data-act="saveR">Guardar rutina</button>`}

function vLogin(){return `<h1 style="margin-top:28px">Bienvenida a FITNESS</h1><p class="sub">Ingresa con tu usuario y contraseña</p>
 <form id="lf" autocomplete="off"><label class="lab" for="uIn">Usuario</label><input id="uIn" autocapitalize="none" autocorrect="off" spellcheck="false">
 <label class="lab" for="pIn">Contraseña</label><div style="position:relative"><input id="pIn" type="password" style="padding-right:56px"><button type="button" id="eye" data-act="eye" aria-label="Mostrar contraseña" aria-pressed="false" style="position:absolute;right:0;top:0;width:52px;height:48px;border:0;background:transparent;color:#D5DAE0;display:flex;align-items:center;justify-content:center"><svg id="eyeI" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
 ${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}
 <div style="height:16px"></div><button class="btn" type="submit" data-act="login">Ingresar</button></form>
 <div class="card" style="margin-top:18px"><div class="lbl" style="margin-top:0">CUENTAS DE DEMOSTRACIÓN</div><div class="m">Cliente: <b>camila</b> / <b>fitness2026</b></div><div class="m" style="margin-top:4px">Entrenador: <b>entrenador</b> / <b>fitness2026</b></div></div>
 <p class="note">Prototipo: las cuentas son de ejemplo y no son seguras.</p>`}
function render(){
 if(!S.auth){$('topR').innerHTML='';$('nav').style.display='none';$('main').innerHTML=vLogin();save();return}
 $('nav').style.display='flex';S.role=S.auth;$('topR').innerHTML='<button class="out" data-act="logout">Salir</button>';const t=S.role;
 const tabs=TABS[t];if(!tabs.some(x=>x[0]===S.tab))S.tab=tabs[0][0];
 $('nav').innerHTML=tabs.map(x=>`<button class="${S.tab===x[0]?'on':''}" data-act="tab" data-v="${x[0]}">${svg(ic[x[2]])}${x[1]}</button>`).join('');
 const V={hoy:vHoy,ag:vAgenda,pr:vProg,ch:vChat,cl:vClientes,ru:vRut};$('main').innerHTML=V[S.tab]();
 const m=$('msgs');if(m)$('main').scrollTop=$('main').scrollHeight;save()}

let rest=0,timer=null;
function startRest(){rest=60;$('rest').style.display='flex';clearInterval(timer);tick();timer=setInterval(()=>{rest--;if(rest<=0){stopRest()}else tick()},1000)}
function tick(){$('restTxt').textContent='Descanso '+rest+' s'}
function stopRest(){clearInterval(timer);$('rest').style.display='none'}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(a==='eye'){const p=$('pIn'),v=p.type==='password';p.type=v?'text':'password';b.setAttribute('aria-pressed',v);b.setAttribute('aria-label',v?'Ocultar contraseña':'Mostrar contraseña');$('eyeI').innerHTML=v?'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A16.5 16.5 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>':'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';return}
 else if(a==='login'){e.preventDefault();const u=($('uIn').value||'').trim().toLowerCase(),p=$('pIn').value;const A={camila:'c',entrenador:'t'};if(A[u]&&p==='fitness2026'){S.auth=A[u];S.role=A[u];S.tab=null;S.sel=null;S.err=''}else{S.err='Usuario o contraseña incorrectos.'}}
 else if(a==='logout'){S.auth=null;S.tab=null;S.sel=null;S.err='';stopRest()}
 else if(a==='tab'){S.tab=d.v;S.sel=null}
 else if(a==='skipRest'){stopRest();return}
 else if(a==='kg'){const it=S.routine.items[+d.i];it.kg=Math.max(0,it.kg+ +d.d)}
 else if(a==='set'){const it=S.routine.items[+d.i],k=+d.k;if(it.done===k+1){it.done=k}else{it.done=k+1;startRest()}}
 else if(a==='day'){S.day=+d.i}
 else if(a==='book'){const i=S.bookings.indexOf(d.k);if(i>=0)S.bookings.splice(i,1);else S.bookings.push(d.k)}
 else if(a==='addW'){const v=parseFloat(($('wIn').value||'').replace(',','.'));if(!(v>20&&v<300))return;S.weights.push(v)}
 else if(a==='send'){const v=$('cIn').value.trim();if(!v)return;S.chat.push({f:S.role==='c'?'c':'t',x:v})}
 else if(a==='flt'){S.filter=d.v}
 else if(a==='open'){S.sel=+d.i}
 else if(a==='back'){S.sel=null}
 else if(a==='toChat'){S.tab='ch'}
 else if(a==='assign'){const t=S.templates[+$('asg').value];S.routine={name:t.name,items:t.items.map(i=>({...i,done:0}))};S.chat.push({f:'t',x:'Te asigné una nueva rutina: '+t.name+'. ¡Mucho éxito!'});S.clients[0].days=0}
 else if(a==='addEx'){S.builder.name=$('bName').value;S.builder.items.push({ex:$('bSel').value,sets:3,reps:10,kg:0})}
 else if(a==='rmEx'){S.builder.name=$('bName').value;S.builder.items.splice(+d.i,1)}
 else if(a==='saveR'){const n=$('bName').value.trim();if(!n||!S.builder.items.length)return;S.templates.push({name:n,items:S.builder.items});S.builder={name:'',items:[]}}
 render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='cIn'){e.preventDefault();document.querySelector('[data-act=send]').click()}if(e.target.id==='wIn'){e.preventDefault();document.querySelector('[data-act=addW]').click()}}});
render();
