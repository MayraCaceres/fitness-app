function vHoy(){const r=S.routine,tot=r.items.reduce((a,i)=>a+i.sets,0),dn=r.items.reduce((a,i)=>a+i.done,0),pct=tot?Math.round(dn/tot*100):0;
 return `<div class="row" style="margin-bottom:14px">${av(S.avatars.c,56)}<div><h1 style="margin:0">Hola, Camila</h1><p class="sub" style="margin:0">Tu entrenamiento de hoy</p></div></div>
 <div class="lime"><div class="m" style="color:#04110A;opacity:.8;font-weight:600">Rutina asignada</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px">${esc(r.name)}</div><div class="bar"><i style="width:${pct}%"></i></div><div style="font-size:13px;font-weight:700;margin-top:6px">${dn} de ${tot} series · ${pct}%${pct===100?' · ¡Completado!':''}</div></div>
 <div class="lbl">EJERCICIOS</div>`+r.items.map((it,i)=>`<div class="card"><div class="row"><div class="grow"><div class="t">${esc(it.ex)}</div><div class="m">${it.sets} × ${it.reps}${it.kg?' · '+it.kg+' kg':' · peso corporal'}</div></div>${it.kg?`<button class="sm" aria-label="Bajar peso" data-act="kg" data-i="${i}" data-d="-2.5">−</button><button class="sm" aria-label="Subir peso" data-act="kg" data-i="${i}" data-d="2.5">+</button>`:''}</div><div class="sets">${Array.from({length:it.sets},(_,k)=>`<button class="set ${k<it.done?'on':''}" aria-label="Serie ${k+1}" aria-pressed="${k<it.done}" data-act="set" data-i="${i}" data-k="${k}">${k+1}</button>`).join('')}</div></div>`).join('')+`<p class="note">Marca cada serie al terminarla: se inicia el descanso.</p>`}

function vAgenda(){const ds=dayList(),d=ds[S.day];
 const mine=S.bookings.filter(b=>b.startsWith(d.k));
 let h=`<h1>Agenda</h1><p class="sub">${S.role==='c'?'Reserva tus sesiones':'Sesiones reservadas por tus clientes'}</p><div class="days">`+ds.map((x,i)=>`<button class="day ${i===S.day?'on':''}" data-act="day" data-i="${i}">${x.w}<b>${x.n}</b></button>`).join('')+`</div><div class="lbl">HORARIOS</div><div class="grid3">`;
 h+=SLOTS.map(t=>{const key=d.k+'|'+t,m=S.bookings.includes(key),tk=TAKEN(t+d.n)&&!m;return `<button class="slot ${m?'mine':''} ${tk?'taken':''}" ${tk||S.role==='t'?'disabled':''} data-act="book" data-k="${key}">${t}${m?' ✓':''}</button>`}).join('')+`</div>`;
 h+=`<div class="lbl">${S.role==='c'?'MIS SESIONES':'SESIONES CON CAMILA'}</div>`;
 const all=[...S.bookings].sort();
 h+=all.length?all.map(b=>{const[a,t]=b.split('|');return `<div class="card row"><div class="grow"><div class="t">${t} · ${a.split('-').reverse().join('/')}</div><div class="m">Camila M. · Presencial</div></div>${S.role==='c'?`<button class="sm" style="font-size:13px;padding:0 12px" data-act="book" data-k="${b}">Cancelar</button>`:'<span class="pill">Confirmada</span>'}</div>`}).join(''):`<div class="card m">Sin sesiones reservadas todavía.</div>`;
 return h}

function vProg(){const w=S.weights,mn=Math.min(...w)-.5,mx=Math.max(...w)+.5,pts=w.map((v,i)=>`${8+i*(304/Math.max(w.length-1,1))},${100-((v-mn)/(mx-mn))*85}`);const last=pts[pts.length-1].split(',');
 const diff=(w[w.length-1]-w[0]).toFixed(1).replace('.',',');
 return `<h1>Tu progreso</h1><p class="sub">Seguimiento de peso corporal</p><div class="card"><div class="row"><div class="grow"><div class="m" style="font-weight:600">Peso actual</div><div style="font-size:32px;font-weight:800;letter-spacing:-.02em">${String(w[w.length-1]).replace('.',',')} <span class="m" style="font-size:16px">kg</span></div></div><span class="pill">${diff} kg</span></div>
 <svg viewBox="0 0 320 110" width="100%" role="img" aria-label="Gráfico de peso corporal" style="margin-top:10px;display:block"><line x1="0" y1="102" x2="320" y2="102" stroke="rgba(255,255,255,.2)"/><polyline points="${pts.join(' ')}" fill="none" stroke="#39FF14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="6" fill="#39FF14"/></svg></div>
 <div class="lbl">REGISTRAR PESO</div><div class="row"><input id="wIn" type="number" step="0.1" inputmode="decimal" placeholder="Ej. 63,0" aria-label="Peso en kg"><button class="btn" style="width:120px" data-act="addW">Guardar</button></div>
 <div class="lbl">HOY</div><div class="card row"><div class="grow"><div class="t">Series completadas</div><div class="m">${S.routine.items.reduce((a,i)=>a+i.done,0)} de ${S.routine.items.reduce((a,i)=>a+i.sets,0)}</div></div></div>`}

function vChat(){const me=S.role==='c'?'c':'t';
 return `<h1>Chat</h1><p class="sub">${S.role==='c'?'Con tu entrenador':'Con Camila M.'}</p><div style="display:flex;flex-direction:column;min-height:300px" id="msgs">`+S.chat.map(m=>`<div class="bub ${m.f===me?'me':'you'}">${esc(m.x)}</div>`).join('')+`</div><div class="row" style="margin-top:8px"><input id="cIn" placeholder="Escribe un mensaje" aria-label="Mensaje"><button class="btn" style="width:96px" data-act="send">Enviar</button></div><p class="note">Cambia de modo arriba para ver los dos lados de la conversación.</p>`}

function vClientes(){if(S.sel!=null){const c=S.clients[S.sel];return `<button class="btn o" style="width:auto;height:44px" data-act="back">← Clientes</button><div class="row" style="margin:6px 0 14px">${S.sel===0?av(S.avatars.c,56):''}<div><h1 style="margin:0">${esc(c.n)}</h1><p class="sub" style="margin:0">Objetivo: ${esc(c.goal)}</p></div></div>
 <div class="card"><div class="m">Último entrenamiento</div><div class="t">${c.days===0?'Hoy':'Hace '+c.days+' días'}</div></div>
 <div class="card"><div class="m">Membresía</div><div class="t">Vence en ${c.pay} días</div></div>
 ${S.sel===0?`<div class="card"><div class="m">Rutina actual</div><div class="t">${esc(S.routine.name)}</div></div><div class="lbl">ASIGNAR RUTINA</div><select id="asg" aria-label="Rutina">${S.templates.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select><div style="height:10px"></div><button class="btn" data-act="assign">Asignar a Camila</button>`:'<p class="note">En este prototipo solo Camila recibe rutinas.</p>'}
 <div style="height:10px"></div><button class="btn o" data-act="toChat">Escribir a Camila</button>`}
 const f=S.filter,list=S.clients.map((c,i)=>({c,i})).filter(x=>f==='all'||(f==='idle'&&x.c.days>=3)||(f==='pay'&&x.c.pay<=3));
 return `<h1>Mis clientes</h1><p class="sub">${S.clients.length} activos</p><div class="row" style="margin-bottom:12px"><button class="btn ${f==='all'?'':'o'}" style="height:44px" data-act="flt" data-v="all">Todos</button><button class="btn ${f==='idle'?'':'o'}" style="height:44px" data-act="flt" data-v="idle">Sin entrenar</button><button class="btn ${f==='pay'?'':'o'}" style="height:44px" data-act="flt" data-v="pay">Pagos</button></div>`+
 list.map(({c,i})=>`<button class="card row" style="width:100%;text-align:left" data-act="open" data-i="${i}">${i===0?av(S.avatars.c,44):`<div style="width:44px;height:44px;border-radius:22px;background:#39FF14;color:#04110A;display:flex;align-items:center;justify-content:center;font-weight:700">${c.n.split(' ').map(s=>s[0]).join('')}</div>`}<div class="grow"><div class="t">${esc(c.n)}</div><div class="m">${esc(c.goal)}</div></div>${c.days>=3?`<span class="pill w">${c.days} días sin entrenar</span>`:c.pay<=3?`<span class="pill w">Pago en ${c.pay} d</span>`:'<span class="pill">Al día</span>'}</button>`).join('')}

function vRut(){const b=S.builder;
 return `<h1>Rutinas</h1><p class="sub">Tus plantillas</p>`+S.templates.map(t=>`<div class="card"><div class="t">${esc(t.name)}</div><div class="m">${t.items.length} ejercicios · ${t.items.map(i=>esc(i.ex)).join(', ')}</div></div>`).join('')+
 `<div class="lbl">CREAR NUEVA RUTINA</div><input id="bName" placeholder="Nombre de la rutina" aria-label="Nombre" value="${esc(b.name)}">
 <div style="height:10px"></div><select id="bSel" aria-label="Ejercicio">${LIB.map(e=>`<option value="${e.n}">${e.n} (${e.g})</option>`).join('')}</select><div style="height:10px"></div><button class="btn o" data-act="addEx">+ Agregar ejercicio (3 × 10)</button>`+
 b.items.map((it,i)=>`<div class="card row"><div class="grow"><div class="t">${esc(it.ex)}</div><div class="m">${it.sets} × ${it.reps}</div></div><button class="sm" aria-label="Quitar" data-act="rmEx" data-i="${i}">×</button></div>`).join('')+
 `<div style="height:6px"></div><button class="btn" data-act="saveR">Guardar rutina</button>`}

function vLogin(){return `<h1 style="margin-top:28px">Bienvenida a FITNESS</h1><p class="sub">Ingresa con tu usuario y contraseña</p>
 <form id="lf" autocomplete="off"><label class="lab" for="uIn">Usuario</label><input id="uIn" autocapitalize="none" autocorrect="off" spellcheck="false">
 <label class="lab" for="pIn">Contraseña</label><div style="position:relative"><input id="pIn" type="password" style="padding-right:56px"><button type="button" id="eye" data-act="eye" aria-label="Mostrar contraseña" aria-pressed="false" style="position:absolute;right:0;top:0;width:52px;height:48px;border:0;background:transparent;color:#D5DAE0;display:flex;align-items:center;justify-content:center"><svg id="eyeI" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
 ${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:''}
 <div style="height:16px"></div><button class="btn" type="submit" data-act="login">Ingresar</button></form>
 <div class="card" style="margin-top:18px"><div class="lbl" style="margin-top:0">CUENTAS DE DEMOSTRACIÓN</div><div class="m">Cliente: <b>camila</b> / <b>fitness2026</b></div><div class="m" style="margin-top:4px">Entrenador: <b>entrenador</b> / <b>fitness2026</b></div></div>
 <p class="note">Prototipo: las cuentas son de ejemplo y no son seguras.</p>`}
function render(){
 if(!S.auth){$('topR').innerHTML='';$('nav').style.display='none';$('main').innerHTML=vLogin();save();return}
 $('nav').style.display='flex';S.role=S.auth;$('topR').innerHTML='<div class="row" style="gap:10px"><button class="avb" data-act="openAv" aria-label="Personalizar mi avatar">'+av(S.avatars[S.role],40)+'</button><button class="out" data-act="logout">Salir</button></div>';const t=S.role;
 const tabs=TABS[t];if(S.tab!=='av'&&!tabs.some(x=>x[0]===S.tab))S.tab=tabs[0][0];
 $('nav').innerHTML=tabs.map(x=>`<button class="${S.tab===x[0]?'on':''}" data-act="tab" data-v="${x[0]}">${svg(ic[x[2]])}${x[1]}</button>`).join('');
 const V={av:vAv,hoy:vHoy,ag:vAgenda,pr:vProg,ch:vChat,cl:vClientes,ru:vRut};const sc=$('main').scrollTop,same=lastTab===S.tab;$('main').innerHTML=V[S.tab]();if(same&&S.tab==='av')$('main').scrollTop=sc;lastTab=S.tab;S.pop=false;
 const m=$('msgs');if(m)$('main').scrollTop=$('main').scrollHeight;save()}

let rest=0,timer=null;
function startRest(){rest=60;$('rest').style.display='flex';clearInterval(timer);tick();timer=setInterval(()=>{rest--;if(rest<=0){stopRest()}else tick()},1000)}
function tick(){$('restTxt').textContent='Descanso '+rest+' s'}
function stopRest(){clearInterval(timer);$('rest').style.display='none'}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(a==='avset'){S.avatars[S.role][d.k]=d.v;S.pop=true}
 else if(a==='avrand'){const o=S.avatars[S.role];AVO.forEach(g=>{o[g.k]=g.o[Math.floor(Math.random()*g.o.length)].v});S.pop=true}
 else if(a==='openAv'){S.prev=S.tab;S.tab='av'}
 else if(a==='closeAv'){S.tab=(S.prev&&S.prev!=='av')?S.prev:null}
 else if(a==='eye'){const p=$('pIn'),v=p.type==='password';p.type=v?'text':'password';b.setAttribute('aria-pressed',v);b.setAttribute('aria-label',v?'Ocultar contraseña':'Mostrar contraseña');$('eyeI').innerHTML=v?'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A16.5 16.5 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>':'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';return}
 else if(a==='login'){e.preventDefault();const u=($('uIn').value||'').trim().toLowerCase(),p=$('pIn').value;const A={camila:'c',entrenador:'t'};if(A[u]&&p==='fitness2026'){S.auth=A[u];S.role=A[u];S.tab=null;S.sel=null;S.err=''}else{S.err='Usuario o contraseña incorrectos.'}}
 else if(a==='logout'){S.auth=null;S.tab=null;S.sel=null;S.err='';stopRest()}
 else if(a==='tab'){S.tab=d.v;S.sel=null}
 else if(a==='skipRest'){stopRest();return}
 else if(a==='kg'){const it=S.routine.items[+d.i];it.kg=Math.max(0,it.kg+ +d.d)}
 else if(a==='set'){const it=S.routine.items[+d.i],k=+d.k;if(it.done===k+1){it.done=k}else{it.done=k+1;startRest()}}
 else if(a==='day'){S.day=+d.i}
 else if(a==='book'){const i=S.bookings.indexOf(d.k);if(i>=0)S.bookings.splice(i,1);else S.bookings.push(d.k)}
 else if(a==='addW'){const v=parseFloat(($('wIn').value||'').replace(',','.'));if(!(v>20&&v<300))return;S.weights.push(v)}
 else if(a==='send'){const v=$('cIn').value.trim();if(!v)return;S.chat.push({f:S.role==='c'?'c':'t',x:v})}
 else if(a==='flt'){S.filter=d.v}
 else if(a==='open'){S.sel=+d.i}
 else if(a==='back'){S.sel=null}
 else if(a==='toChat'){S.tab='ch'}
 else if(a==='assign'){const t=S.templates[+$('asg').value];S.routine={name:t.name,items:t.items.map(i=>({...i,done:0}))};S.chat.push({f:'t',x:'Te asigné una nueva rutina: '+t.name+'. ¡Mucho éxito!'});S.clients[0].days=0}
 else if(a==='addEx'){S.builder.name=$('bName').value;S.builder.items.push({ex:$('bSel').value,sets:3,reps:10,kg:0})}
 else if(a==='rmEx'){S.builder.name=$('bName').value;S.builder.items.splice(+d.i,1)}
 else if(a==='saveR'){const n=$('bName').value.trim();if(!n||!S.builder.items.length)return;S.templates.push({name:n,items:S.builder.items});S.builder={name:'',items:[]}}
 render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='cIn'){e.preventDefault();document.querySelector('[data-act=send]').click()}if(e.target.id==='wIn'){e.preventDefault();document.querySelector('[data-act=addW]').click()}}});
render();
</script>
</body>
</html>
